name: rackscout
services:
  db:
    image: docker.io/library/postgres:16.11-alpine
    environment:
      POSTGRES_DB: rackscout
      POSTGRES_USER: rackscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rackscout -d rackscout"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: localhost/rackscout:0.1.0
    build: .
    command: [python, -m, rackscout, migrate]
    environment: &database-env
      PGHOST: db
      PGDATABASE: rackscout
      PGUSER: rackscout
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  web:
    image: localhost/rackscout:0.1.0
    build: .
    environment: *database-env
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  collect:
    image: localhost/rackscout:0.1.0
    build: .
    command: [python, -m, rackscout, collect]
    environment: *database-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [collector]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Required by Chromium's sandbox; web and migration containers retain no capabilities.
    cap_add: [SYS_CHROOT]
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
volumes:
  database:
